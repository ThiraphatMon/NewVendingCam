services:
  vending-cam:
    # อัพเดทใหม่สำหรับลง Orange Pi: build บนบอร์ดจะเลือก linux/arm64 อัตโนมัติ
    build: .
    # ตั้งชื่อ image ไว้ → ก่อนอัปเดต tag เก็บเป็น vending-cam:prev เพื่อ rollback ได้ (ดู HANDOVER 9.2)
    image: vending-cam:latest
    container_name: vending-cam
    init: true
    restart: unless-stopped
    stop_grace_period: 10s
    # Redis ของ controller อยู่บนบอร์ดเดียวกัน (127.0.0.1:6379) → ใช้ network ของ host
    # ไม่มี Redis service ในไฟล์นี้ — ห้ามเพิ่ม (ต้องใช้ Redis ตัวเดียวกับ controller)
    network_mode: host
    env_file:
      - .env
    environment:
      # เวลาใน log / ชื่อไฟล์ภาพเป็นเวลาไทย (ยอดรายวันใช้ COUNT_TIMEZONE แยกอยู่แล้ว)
      - TZ=Asia/Bangkok
    devices:
      # ค่าเริ่มต้นสำหรับกล้อง USB/UVC; ตรวจด้วย v4l2-ctl --list-devices บนบอร์ด
      - /dev/video0:/dev/video0
    volumes:
      # เก็บข้อมูลไว้นอก container เพื่อไม่ให้หายตอน rebuild/recreate
      - ./evidence_images:/app/evidence_images
      # data/ = roi_config.json + vending_state.sqlite3 (ยอด/รอบ) — ห้ามลบ
      - ./data:/app/data
      - ./logs:/app/logs
    logging:
      # จำกัด Docker stdout log เพื่อป้องกัน eMMC เต็มระหว่างการทดสอบระยะยาว
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
